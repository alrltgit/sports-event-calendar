[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-event-calendar"
version = "0.1.0"
description = "A Flask web application for viewing, filtering, and adding sports events."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask~=3.1.2",
    "PyMySQL~=1.1.2",
    "SQLAlchemy~=2.0.44",
    "python-dotenv~=1.2.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["database", "event", "main"]

[tool.unittest]
start-dir = "tests"
