<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sports Event Calendar</title>
    <link rel="stylesheet" href="../static/home.css">
</head>
<body>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('calendar') }}">Calendar</a>
        <a href="#">Competitions</a>
        <a href="#">Teams</a>
    </nav>
    <main>
        <section class="head">
            <h1>Sports Event Calendar</h1>
            <p>Track upcoming matches, live events, and results in one place</p>
            <button class="add-event-btn">Add Event</button>

            <div id="add-event" class="new-event">
                <div class="event-content">
                    <span class="close">&times;</span>
                    <h2>Add New Event</h2>
                    <form id="eventForm">
                        <label for="date">Date (yy/mm/dd hh:mm):</label>
                        <input type="text" name="date" id="date" required>

                        <label for="competition">Competition:</label>
                        <input type="text" name="competition" id="competition" required>

                        <label for="sport">Sport:</label>
                        <input type="text" name="sport" id="sport" required>

                        <label for="venue">Venue:</label>
                        <input type="text" name="venue" id="venue" required>

                        <label for="location">Location:</label>
                        <input type="text" name="location" id="location" required>

                        <label for="participants">Participants (team1 vs team2):</label>
                        <input type="text" name="participants" id="participants" required>

                        <button type="submit">Add Event</button>
                    </form>
                </div>
            </div>
        </section>

        <section>
            <h2>🔴 Live now</h2>
            <div id="live-events" class="events-container"></div>
        </section>

        <section>
            <h2>📆 Upcoming Events</h2>
            <div id="upcoming-events" class="events-container"></div>
        </section>
    </main>
    <footer>
        <p>&copy Sports Event Calendar. All rights reserved</p>
    </footer>
    <script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>
</html>
