<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calendar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='calendar.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('calendar') }}">Calendar</a>
        <a href="#">Competitions</a>
        <a href="#">Teams</a>
    </nav>
    <main>
        <div class="filter-buttons">
            <button onclick="filterEvents('all')">All</button>
            <button onclick="filterEvents('scheduled')">Scheduled</button>
            <button onclick="filterEvents('live')">Live</button>
            <button onclick="filterEvents('finished')">Finished</button>
        </div>
        <div class="filter-card">
            <label for="filter">Filter:</label>
            <select name="filter" id="filter">
                <option value="All">All</option>
                <option value="Basketball">Basketball</option>
                <option value="Cycling">Cycling</option>
                <option value="Cricket">Cricket</option>
                <option value="Football">Football</option>
                <option value="MMA">MMA</option>
                <option value="Tennis">Tennis</option>
            </select>
        </div>
        <div class="events-calendar" id="events"></div>
    </main>
    <footer>
        <p>&copy Sports Event Calendar. All rights reserved</p>
    </footer>
    <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
</body>
</html>
